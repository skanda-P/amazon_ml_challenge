system:
  device: "auto"        # "auto" (uses CUDA GPU if present, with automatic CPU fallback), "cuda", or "cpu"

data:
  train_dir: "../../data/dataset/train"
  test_dir:  "../../data/dataset/test"

blocking:
  top_k_name:       10       # top-k from name TF-IDF per S1 entity
  top_k_addr:       10       # top-k from address TF-IDF per S1 entity
  top_k_embed:      15       # top-k from embedding kNN per S1 entity
  name_min_score:   0.25     # min TF-IDF cosine to include in name pass
  addr_min_score:   0.20     # min TF-IDF cosine to include in addr pass
  embed_min_score:  0.70     # min cosine to include in embedding pass
  embed_model:      "intfloat/multilingual-e5-large"   # MIT, ~560M params
  use_embeddings:   false    # set true to enable embedding kNN (slower, better for France)
  device:           "auto"   # "auto" (uses CUDA GPU with CPU fallback), "cuda", or "cpu"

model:
  device:           "auto"   # "auto" (uses CUDA GPU with CPU fallback), "cuda", or "cpu"
  n_estimators:     500
  max_depth:        7
  num_leaves:       63
  learning_rate:    0.03
  scale_pos_weight: 15       # class imbalance weight: ~neg/pos ratio
  random_state:     42

stacking:
  n_splits:  5               # K-fold OOF folds
  calibrate: true            # isotonic calibration on meta-learner

validation:
  val_size:     0.20         # fraction of S1 entities held out
  random_state: 42

threshold:
  search_start: 0.10
  search_end:   0.95
  search_steps: 60
  margin_gaps:  [0.0, 0.05, 0.10, 0.15, 0.20]   # abstention gap values to try

output:
  model_dir:      "models"
  matching_path:  "../../output/matching_results.tsv"
  candidate_path: "../../output/candidate_pairs.tsv"
